[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "larper"
version = "0.1.0"
description = "Convert plain user requests into stronger task-specific role prompts using the Larper approach."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Hermes Agent"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
larper = "larper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
